site_name: Flow ETL Ecosystem — Component Guide Handbook
site_description: Documentation
site_url: https://etl-madness.github.io/flow-docs/

theme:
  name: material
  logo: flow-mascot.png
  palette:
    - scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - toc.follow

extra_css:
  - stylesheets/handbook-nav.css?v=4

extra_javascript:
  - javascripts/handbook-nav.js?v=4

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight

nav:

  - Overview & Ecosystem:
      - "📚 hub — Flow Ecosystem Documentation Hub": index.md
      - "📚 flow_executable — Standalone Flow CLI Overview": flow_executable.md
      - "📚 summary — Business & Executive Summary": BUSINESS_SUMMARY.md
      - "📚 builder — CLI Builtin Visual Builder Tour": BUILDER_SLIDESHOW.md
      - "📚 etl — Automation & ETL Summary": guides/AUTOMATION_ETL_SUMMARY.md
  - Build Guide:
      - "📚 CLI Compilation and Build Guide": guides/COMPILATION_AND_BUILD_GUIDE.md
      - "📚 API Compilation and Build Guide — Flow API Reference": guides/API_COMPILATION_AND_BUILD_GUIDE.md
      - "📚 API Docker Deployment Guide": guides/API_DOCKER_DEPLOYMENT_GUIDE.md
      - "📚 API Endpoints Reference": guides/API_ENDPOINTS_REFERENCE.md
      - "📚 FlowUI Compilation and Build Guide": guides/FLOW_UI_COMPILATION_AND_BUILD_GUIDE.md
      - "📚 FlowUI Docker Deployment Guide": guides/FLOW_UI_DOCKER_DEPLOYMENT_GUIDE.md
  - Pipeline Setup:
      - "&lt;variables&gt; — Container for initial pipeline variable declarations, override hierarchy, and runtime scoping.": variables.md
      - "&lt;variable&gt; — Initializes a named pipeline variable with explicit type conversion and variable interpolation support.": variable.md
      - "&lt;databases&gt; — Container for relational SQL and Key-Value database connection pools and pipeline lifecycle integration.": databases.md
      - "&lt;database&gt; — Defines a named database connection pool (MSSQL, PostgreSQL, MySQL, SQLite, Oracle, KV).": database.md
      - "&lt;preflight&gt; — A container for pre-execution quality gates, environment readiness checks, and assertions.": preflight.md
      - "&lt;flow&gt; — Main execution container for sequential, conditional, iterative, and concurrent pipeline steps.": flow.md
  - Control Flow:
      - "&lt;group&gt; — Groups pipeline steps together with independent retry, transaction boundaries, and error policies.": group.md
      - "&lt;if&gt; — Evaluates an expression or variable equality to execute steps in &lt;then&gt; and &lt;else&gt; branches.": if_then_else.md
      - "&lt;foreach&gt; — Iterates over rows returned by a SQL query with constant-memory streaming or optional buffering.": foreach.md
      - "&lt;while&gt; — Executes inner steps repeatedly while a condition expression remains true.": while.md
      - "&lt;parallel&gt; — Executes child branches or tasks concurrently across multiple goroutines with synchronization.": parallel.md
  - Quality & Validation:
      - "&lt;assert&gt; — Enforces data quality rules and halts or warns if an expression fails.": assert.md
  - Scripting:
