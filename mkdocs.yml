      - "📚 golang — Embedded Go Scripting Guide": golang.md
      - "📚 lua — Embedded Lua Scripting Guide": lua.md
      - "📚 csx — C# Scripting Guide (dotnet-script)": csx.md
      - "📚 powershell — PowerShell Scripting Guide (pwsh & Windows PowerShell)": powershell.md
